              - P5-S1 — GE up: psp/sprints/011-phase5-ge-up.md
              - P5-S2 — Texture parity: psp/sprints/012-phase5-texture-parity.md
              - P5-S3 — Corpus and counters: psp/sprints/013-phase5-corpus-and-counters.md
              - P5-S4 — Ceiling, VRAM, readback: psp/sprints/014-phase5-ceiling-vram-readback.md
          - 6 — Textures and VRAM:
              - psp/phases/06-textures-vram/index.md
              - P6-S1 — Fill and texture format: psp/sprints/010-phase6-fill-and-texture-format.md
              - P6-S2 — NPOT and VRAM: psp/sprints/015-phase6-npot-and-vram.md
              - P6-S3 — Residency and eviction: psp/sprints/016-phase6-residency-eviction.md
