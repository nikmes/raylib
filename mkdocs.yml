site_name: raylib 6.2 on PSP
site_description: Working memory map, roadmap and measurements for the PSP backend
site_author: nikmes
docs_dir: docs
use_directory_urls: true

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  icon:
    repo: fontawesome/brands/github

repo_name: nikmes/raylib
repo_url: https://github.com/nikmes/raylib

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Overview: index.md
  - Samples: samples/index.md
  - PSP:
      - Memory map & roadmap: psp/memory-map.md
      - Environment & toolchain: psp/environment.md
      - Baseline numbers: psp/baselines.md
      - Phases:
          - psp/phases/index.md
          - 0 — Baseline:
              - psp/phases/00-baseline/index.md
              - P0-S1 — Baseline: psp/sprints/000-phase0-baseline.md
          - 1 — 6.2 boots on pspGL:
              - psp/phases/01-bring-up-6-2/index.md
              - P1-S1 — Import platform: psp/sprints/001-phase1-import-platform.md
              - P1-S2 — Samples green: psp/sprints/002-phase1-samples-green.md
          - 2 — Instrumentation and baseline:
              - psp/phases/02-instrumentation/index.md
              - P2-S1 — Counters: psp/sprints/003-phase2-counters.md
              - P2-S2 — Baselines: psp/sprints/004-phase2-baselines.md
          - 3 — pspGL upgrade A/B:
              - psp/phases/03-pspgl-upgrade/index.md
              - P3-S1 — pspGL A/B: psp/sprints/005-phase3-pspgl-ab.md
              - P3-S2 — Decide: psp/sprints/006-phase3-decide.md
          - 4 — PSP fixed-function rlgl batcher:
              - psp/phases/04-rlgl-batcher/index.md
              - P4-S1 — Batch skeleton: psp/sprints/007-phase4-batch-skeleton.md
              - P4-S2 — Sprite primitive: psp/sprints/008-phase4-sprite-primitive.md
              - P4-S3 — Inline vertex path: psp/sprints/009-phase4-inline-vertex-path.md
          - 5 — Native GU backend:
